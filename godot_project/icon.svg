<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3B8C"/>
      <stop offset="50%" stop-color="#0A1940"/>
      <stop offset="100%" stop-color="#040816"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="50%" stop-color="#FFD22B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" stroke="url(#gold)" stroke-width="14"/>
  <!-- Glowing Sapphire Portal Halo -->
  <circle cx="256" cy="214" r="142" fill="none" stroke="#00E5FF" stroke-width="5" opacity="0.55"/>
  <!-- Symmetrical Golden Angelic Wings -->
  <polygon points="156,220 52,148 104,196 44,202 108,236 62,254 148,268" fill="url(#gold)" stroke="#78350F" stroke-width="3"/>
  <polygon points="356,220 460,148 408,196 468,202 404,236 450,254 364,268" fill="url(#gold)" stroke="#78350F" stroke-width="3"/>
  <!-- 5-Peak Royal Golden Crown -->
  <polygon points="154,198 136,118 192,154 218,96 256,68 294,96 320,154 376,118 358,198" fill="url(#gold)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  <!-- Blue Sapphire Diamonds on Crown -->
  <polygon points="256,118 272,146 256,174 240,146" fill="url(#sapphire)" stroke="#FFF9D2" stroke-width="3"/>
  <polygon points="196,144 206,162 196,180 186,162" fill="url(#sapphire)" stroke="#FFF9D2" stroke-width="2"/>
  <polygon points="316,144 326,162 316,180 306,162" fill="url(#sapphire)" stroke="#FFF9D2" stroke-width="2"/>
  <!-- Ancient Stone & Gold Shield Plaque -->
  <polygon points="84,212 428,212 404,352 256,396 108,352" fill="#0D1636" stroke="url(#gold)" stroke-width="8"/>
  <text x="256" y="276" font-family="serif" font-weight="900" font-size="56" fill="url(#gold)" text-anchor="middle">MYTHORIA</text>
  <text x="256" y="318" font-family="serif" font-weight="800" font-size="28" fill="#00E5FF" text-anchor="middle">— games —</text>
  <text x="256" y="362" font-family="serif" font-style="italic" font-weight="700" font-size="28" fill="#FFF3B0" text-anchor="middle">By ahmed</text>
  <!-- Game Title Banner at Base -->
  <rect x="116" y="416" width="280" height="58" rx="22" fill="#132D6A" stroke="url(#gold)" stroke-width="5"/>
  <text x="256" y="454" font-family="sans-serif" font-weight="900" font-size="34" fill="#FFD22B" text-anchor="middle">DON'T FALL!</text>
</svg>
